<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Wing gradients -->
    <linearGradient id="leftWingGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#94a3b8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="rightWingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#94a3b8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Group with subtle drop shadow -->
  <g filter="url(#softGlow)">
    <!-- Legs -->
    <path d="M 24 28 Q 12 24 10 18" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 40 28 Q 52 24 54 18" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 24 34 Q 10 34 8 36" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 40 34 Q 54 34 56 36" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 26 42 Q 14 48 12 56" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 38 42 Q 50 48 52 56" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Left Wing -->
    <path d="M 30 26 C 14 18, 4 32, 16 48 C 22 56, 30 40, 30 28 Z"
          fill="url(#leftWingGrad)" stroke="#64748b" stroke-width="1.2" stroke-opacity="0.8"/>
    <!-- Wing Vein -->
    <path d="M 29 27 Q 18 36 20 45" stroke="#94a3b8" stroke-width="0.8" fill="none" opacity="0.7"/>

    <!-- Right Wing -->
    <path d="M 34 26 C 50 18, 60 32, 48 48 C 42 56, 34 40, 34 28 Z"
          fill="url(#rightWingGrad)" stroke="#64748b" stroke-width="1.2" stroke-opacity="0.8"/>
    <!-- Wing Vein -->
    <path d="M 35 27 Q 46 36 44 45" stroke="#94a3b8" stroke-width="0.8" fill="none" opacity="0.7"/>

    <!-- Abdomen -->
    <ellipse cx="32" cy="42" rx="7.5" ry="12" fill="url(#bodyGrad)" stroke="#475569" stroke-width="1"/>
    <!-- Abdomen Segments -->
    <path d="M 26 36 Q 32 38 38 36" stroke="#64748b" stroke-width="1" fill="none"/>
    <path d="M 25 41 Q 32 43 39 41" stroke="#64748b" stroke-width="1" fill="none"/>
    <path d="M 26 47 Q 32 49 38 47" stroke="#64748b" stroke-width="1" fill="none"/>

    <!-- Thorax -->
    <ellipse cx="32" cy="27" rx="8" ry="7.5" fill="url(#bodyGrad)" stroke="#475569" stroke-width="1"/>
    <!-- Thorax Highlights -->
    <ellipse cx="32" cy="25" rx="5" ry="3" fill="#475569" opacity="0.4"/>

    <!-- Head -->
    <ellipse cx="32" cy="18" rx="6" ry="4.5" fill="#1e293b"/>

    <!-- Left Compound Eye -->
    <ellipse cx="28" cy="17" rx="3.5" ry="4" fill="url(#eyeGrad)" stroke="#7f1d1d" stroke-width="0.7"/>
    <circle cx="27" cy="15.5" r="1.2" fill="#ffffff" opacity="0.8"/>

    <!-- Right Compound Eye -->
    <ellipse cx="36" cy="17" rx="3.5" ry="4" fill="url(#eyeGrad)" stroke="#7f1d1d" stroke-width="0.7"/>
    <circle cx="35" cy="15.5" r="1.2" fill="#ffffff" opacity="0.8"/>

    <!-- Antennae -->
    <path d="M 30 14 Q 28 10 26 8" stroke="#1e293b" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M 34 14 Q 36 10 38 8" stroke="#1e293b" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  </g>
</svg>
